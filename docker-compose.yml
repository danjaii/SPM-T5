# All images build from the repo root: they need the root pnpm-lock.yaml and
# packages/shared, which a per-folder build context can't see.
#
# For local Supabase (Postgres/Auth/Storage) run the Supabase CLI stack separately:
#   supabase start
# rather than duplicating it here. Inside a container `localhost` is the container
# itself, so set DOCKER_SUPABASE_URL=http://host.docker.internal:54321 in .env to
# reach it. If unset, containers use SUPABASE_URL as-is (fine for a hosted project).

x-service: &service
  env_file: .env
  environment:
    SUPABASE_URL: ${DOCKER_SUPABASE_URL:-${SUPABASE_URL}}
  extra_hosts:
    - "host.docker.internal:host-gateway" # Linux; Docker Desktop provides it already

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Read by the browser, so these must be host-reachable URLs and public keys only.
        # No env_file here: the web container must never receive SUPABASE_SECRET_KEY.
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
    ports: ["3000:3000"]
    environment:
      # Server-side calls (route guard, dashboard, event and venue pages) use the compose network, where every
      # service listens on 4000; the browser uses the NEXT_PUBLIC_*_SERVICE_URL host ports instead.
      AUTH_SERVICE_URL: http://auth-service:4000
      EVENT_SERVICE_URL: http://event-service:4000
      VENUE_SERVICE_URL: http://venue-service:4000
      EQUIPMENT_SERVICE_URL: http://equipment-service:4000
      NOTIFICATION_SERVICE_URL: http://notification-service:4000
    depends_on: [auth-service, event-service, venue-service, equipment-service, notification-service]

  auth-service:
    <<: *service
    build: { context: ., dockerfile: services/auth-service/Dockerfile }
    ports: ["4001:4000"]

  event-service:
    <<: *service
    build: { context: ., dockerfile: services/event-service/Dockerfile }
    ports: ["4002:4000"]

  venue-service:
    <<: *service
    build: { context: ., dockerfile: services/venue-service/Dockerfile }
    ports: ["4003:4000"]

  equipment-service:
    <<: *service
    build: { context: ., dockerfile: services/equipment-service/Dockerfile }
    ports: ["4004:4000"]

  notification-service:
    <<: *service
    build: { context: ., dockerfile: services/notification-service/Dockerfile }
    ports: ["4005:4000"]
