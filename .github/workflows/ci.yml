name: CI

# One pipeline for the whole monorepo. `pnpm vitest run` at the root discovers every workspace's tests
# (see vitest.config.mts), so adding a service needs no change here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Point tests at a Supabase test project / local instance.
      # Configure these as repo or environment secrets.
      SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      # On a pull request this checkout is the PR combined with the latest main, so two migrations that share a
      # number (one from the PR, one already on main) fail here, before merging. Fast, so it runs first.
      - name: Check migration numbers are unique
        run: bash scripts/check-migration-numbers.sh

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Vitest version
        run: test "$(pnpm vitest --version | sed -E 's|^vitest/([0-9.]+).*|\1|')" = "4.1.11"

      - name: Lint
        run: pnpm run lint:all

      - name: Type check
        run: pnpm -r --if-present run typecheck

      - name: Tests
        run: pnpm vitest run # also writes the coverage report to ./coverage (see vitest.config.mts)

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 14

      - name: Build
        run: pnpm run build:all

  # Database-backed tests (tests/integration): a real local Supabase, so migrations and constraints
  # (slot exclusion, one active request per event) are checked against Postgres, not a fake.
  # Runs in parallel with `test`, which skips these suites because it has no SUPABASE_SECRET_KEY.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # @supabase/realtime-js (pulled in by supabase-js) needs a native WebSocket, which Node 20 lacks
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          # Pinned: "latest" makes the action query the GitHub API unauthenticated, which hits the shared
          # runner rate limit. Matches the local CLI; bump deliberately.
          version: 2.119.0

      - name: Start local Supabase (applies supabase/migrations, then seed.sql)
        run: supabase start

      - name: Export local connection details for the tests
        run: |
          supabase status -o env \
            | grep -E '^(API_URL|SECRET_KEY|PUBLISHABLE_KEY)=' \
            | sed -E 's/^API_URL=/SUPABASE_URL=/; s/^SECRET_KEY=/SUPABASE_SECRET_KEY=/; s/^PUBLISHABLE_KEY=/SUPABASE_PUBLISHABLE_KEY=/' \
            | tr -d '"' >> "$GITHUB_ENV"

      - name: Fail loudly if the database is not configured (otherwise the tests would silently skip)
        run: test -n "$SUPABASE_URL" && test -n "$SUPABASE_SECRET_KEY" && test -n "$SUPABASE_PUBLISHABLE_KEY"

      # Every service by pattern, not by name: a hand-written list left out notification-service, so its tests never ran.
      - name: Integration tests
        run: pnpm vitest run --project '@spm-t5/*-service' tests/integration --coverage.enabled=false

  # Applies new supabase/migrations files to the hosted Supabase project, so merging to main is the only way a migration
  # reaches it. Never paste migration SQL into the dashboard SQL editor instead: it runs there but isn't recorded, so a
  # later push re-runs it (and fails) or skips a file that shares its number. Runs after the database tests pass.
  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, integration]
    runs-on: ubuntu-latest
    # Two merges in quick succession queue up rather than pushing at the same time.
    concurrency:
      group: migrate-hosted-db
      cancel-in-progress: false
    env:
      # Session pooler connection string (IPv4; the direct db.<ref>.supabase.co host is IPv6-only and GitHub runners
      # have no IPv6), with the password percent-encoded. See .github/workflows/README.md → Secrets required.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0 # same pin as the integration job

      - name: Validate hosted database connection string
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "::error::Add the SUPABASE_DB_URL repository secret"; exit 1; }

          if [[ "$SUPABASE_DB_URL" == *'${'* || "$SUPABASE_DB_URL" == *'<project-ref>'* || "$SUPABASE_DB_URL" == *'<password>'* ]]; then
            echo "::error::SUPABASE_DB_URL contains an unresolved placeholder. Replace placeholders with real values (for example, use postgres.<project-ref> from the Supabase dashboard, not postgres.\${REF})."
            exit 1
          fi

          if [[ ! "$SUPABASE_DB_URL" =~ ^postgres(ql)?://postgres\.[^:]+:[^@]+@[^/]+/postgres([?].*)?$ ]]; then
            echo "::error::SUPABASE_DB_URL must be a valid session pooler URL: postgresql://postgres.<project-ref>:<password>@<pooler-host>:5432/postgres"
            exit 1
          fi

      # --include-all: when two PRs add 19 and 20 and 20 merges first, 19 is still applied (numbers are unique, see
      # scripts/check-migration-numbers.sh). Without it the push refuses a file numbered below the last applied one.
      - name: Apply new migrations to the hosted database
        run: supabase db push --include-all --yes --db-url "$SUPABASE_DB_URL"

  e2e:
    needs: test
    runs-on: ubuntu-latest
    # A normal run takes about 2 minutes. The browser install once hung on a slow apt mirror for up to an hour; fail
    # instead so the run can be re-run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium only, the one project in apps/web/playwright.config.ts. No --with-deps: ubuntu-latest already has Chromium's
      # system libraries, and --with-deps runs apt, which hung when the runner's mirror was slow. If an image update drops a
      # library, Chromium fails to launch naming it; add --with-deps back then.
      - name: Install Playwright browsers
        run: pnpm --filter @spm-t5/web exec playwright install chromium

      - name: Run E2E tests
        run: pnpm --filter @spm-t5/web run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14
