name: Render C4 diagrams

# Keeps docs/architecture/c4/rendered/*.svg in sync with the .puml sources whenever
# the architecture model changes, so the diagrams in docs/architecture never go stale.
on:
  push:
    branches: [main]
    paths:
      - "docs/architecture/c4/**"
      - ".github/workflows/c4-diagrams.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/architecture/c4/**"
      - ".github/workflows/c4-diagrams.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    # The push step commits the re-rendered SVGs back to main, which needs write access to repo contents.
    # GITHUB_TOKEN is read-only by default, so grant it explicitly (PR runs only read, but the job-level grant is harmless).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The cloudbees/plantuml-github-action this used to call no longer exists; PlantUML's official Docker
      # image does the same job. -failfast2 makes a syntax error in a .puml fail the job instead of rendering
      # an error picture. Output goes to docs/architecture/c4/rendered (-o is relative to each .puml).
      - name: Render PlantUML C4 diagrams to SVG
        run: docker run --rm -v "$PWD:/work" -w /work plantuml/plantuml -failfast2 -tsvg -o rendered docs/architecture/c4/*.puml

      - name: Commit rendered diagrams back to the branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/c4/rendered
          git diff --cached --quiet || git commit -m "docs: re-render C4 diagrams [skip ci]"
          git push

      - name: Upload rendered diagrams (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: c4-diagrams
          path: docs/architecture/c4/rendered
