name: EquipmentService CI (services/equipment-service)

on:
  push:
    branches: [main]
    paths:
      - "services/equipment-service/**"
      - "packages/shared/**"
      - ".github/workflows/_service-ci-template.yml"
      - ".github/workflows/service-equipment-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/equipment-service/**"
      - "packages/shared/**"
      - ".github/workflows/_service-ci-template.yml"
      - ".github/workflows/service-equipment-ci.yml"

jobs:
  ci:
    uses: ./.github/workflows/_service-ci-template.yml
    with:
      service_path: services/equipment-service
      service_name: equipment-service
    secrets: inherit
