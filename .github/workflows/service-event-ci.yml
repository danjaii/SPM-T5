name: EventService CI (services/event-service)

on:
  push:
    branches: [main, develop]
    paths:
      - "services/event-service/**"
      - "packages/shared/**"
      - ".github/workflows/_service-ci-template.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/event-service/**"
      - "packages/shared/**"

jobs:
  ci:
    uses: ./.github/workflows/_service-ci-template.yml
    with:
      service_path: services/event-service
      service_name: event-service
    secrets: inherit
