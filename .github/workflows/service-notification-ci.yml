name: NotificationService CI (services/notification-service)

on:
  push:
    branches: [main]
    paths:
      - "services/notification-service/**"
      - "packages/shared/**"
      - ".github/workflows/_service-ci-template.yml"
      - ".github/workflows/service-notification-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/notification-service/**"
      - "packages/shared/**"
      - ".github/workflows/_service-ci-template.yml"
      - ".github/workflows/service-notification-ci.yml"

jobs:
  ci:
    uses: ./.github/workflows/_service-ci-template.yml
    with:
      service_path: services/notification-service
      service_name: notification-service
    secrets: inherit
