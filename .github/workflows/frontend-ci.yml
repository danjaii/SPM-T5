name: Frontend CI (apps/web)

# Runs whenever a change touches the Next.js app or shared package it depends on.
# This is what gives you "tests run after every feature implementation": push a
# feature branch, open a PR, this job runs automatically and must pass to merge.
on:
  push:
    branches: [main, develop]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/web/**"
      - "packages/shared/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Lint
        run: pnpm run --if-present lint

      - name: Type check
        run: pnpm run --if-present typecheck

      - name: Unit + component tests
        run: pnpm run test --coverage

      - name: Build
        run: pnpm run build

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage
          retention-days: 14

  e2e:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run E2E tests
        run: pnpm run --if-present test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14
