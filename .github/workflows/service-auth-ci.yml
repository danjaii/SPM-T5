name: AuthService CI (services/auth-service)

on:
  push:
    branches: [main]
    paths:
      - "services/auth-service/**"
      - "packages/shared/**"
      - ".github/workflows/_service-ci-template.yml"
      - ".github/workflows/service-auth-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/auth-service/**"
      - "packages/shared/**"
      - ".github/workflows/_service-ci-template.yml"
      - ".github/workflows/service-auth-ci.yml"

jobs:
  ci:
    uses: ./.github/workflows/_service-ci-template.yml
    with:
      service_path: services/auth-service
      service_name: auth-service
    secrets: inherit
